background:#111;

}

.logo-banner img{
width:100%;

}

nav{

}

}

.item-top{
display:flex;
justify-content:space-between;
gap:15px;
align-items:flex-start;
}

.item h3{
margin:0 0 5px;
font-size:17px;
}

.item p{
margin:0;
color:#666;
font-size:14px;
line-height:1.4;
}

.price{
color:#d71920;
font-weight:900;
white-space:nowrap;
font-size:17px;
}

.note{
text-align:center;
background:#111;
color:white;
padding:15px;
border-radius:12px;
margin:20px 0;
font-weight:bold;
}

footer{
background:#050505;
color:white;
text-align:center;

footer h2{
background:none;
